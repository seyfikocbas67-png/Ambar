<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metal Başlık Ambar - Admin</title>
<style>
* {margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;}
body {
  height:100vh;
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}
.glass {
  width: 90%;
  max-width: 400px;
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(15px);
  border-radius: 20px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  padding: 40px 30px;
  box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
  animation: fadeIn 1s ease;
}
@keyframes fadeIn {
  from {opacity:0; transform: translateY(20px);}
  to {opacity:1; transform: translateY(0);}
}
.logo {
  text-align:center;
  font-size:24px;
  font-weight:700;
  color:#fff;
  margin-bottom:30px;
  letter-spacing:2px;
}
.input-group {margin-bottom:20px;}
.input-group input {
  width:100%;
  padding:15px;
  background: rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.3);
  border-radius:10px;
  color:#fff;
  font-size:16px;
  outline:none;
  transition:0.3s;
}
.input-group input:focus {
  border-color:#00c6ff;
  background: rgba(255,255,255,0.15);
}
.input-group input::placeholder {color: rgba(255,255,255,0.6);}
.btn {
  width:100%;
  padding:15px;
  background: linear-gradient(90deg, #00c6ff, #0072ff);
  border:none;
  border-radius:10px;
  color:#fff;
  font-size:18px;
  font-weight:600;
  cursor:pointer;
  transition:0.3s;
}
.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 5px 20px rgba(0, 114, 255, 0.4);
}
#mesaj {text-align:center; margin-top:15px; font-weight:600; height:20px;}
</style>
</head>
<body>

<div class="glass">
  <div class="logo">METAL BAŞLIK AMBAR</div>
  <div class="input-group">
    <input type="text" id="kadi" placeholder="Kullanıcı Adı">
  </div>
  <div class="input-group">
    <input type="password" id="sifre" placeholder="Şifre">
  </div>
  <button class="btn" onclick="girisYap()">GİRİŞ YAP</button>
  <p id="mesaj"></p>
</div>

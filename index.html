<!DOCTYPE html>
<html>
<head><title>TEST</title></head>
<body style="background:#2a5caa; color:yellow; text-align:center; padding:50px;">
<h1>BİLGEM AMBAR PROGRAMI</h1>
<h2>Kullanıcı: <input id="kullanici" value="admin"></h2>
<h2>Şifre: <input id="sifre" type="password" value="1234"></h2>
<button onclick="giris()" style="padding:15px; font-size:18px;">GİRİŞ</button>
<h3 id="sonuc"></h3>

<script>
function giris(){
  document.getElementById('sonuc').innerText = "Butona basıldı...";
  if(kullanici.value=="admin" && sifre.value=="1234"){
    document.getElementById('sonuc').innerText = "Şifre Doğru! Menü açılmalıydı.";
    document.body.innerHTML = "<h1 style='color:lime'>GİRİŞ BAŞARILI ✅</h1><h2>Menü buraya gelecek</h2>";
  } else {
    document.getElementById('sonuc').innerText = "Şifre Yanlış!";
  }
}
</script>
</body>
</html>

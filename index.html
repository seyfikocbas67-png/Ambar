<!DOCTYPE html>
<html lang="tr">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metal Başlık V10 Bulut</title>
<style>*{box-sizing:border-box;margin:0;padding:0;}body{font-family:'Segoe UI';background:linear-gradient(135deg,#2a5caa 0%,#1e3f73 100%);min-height:100vh;}.ust{background:#2a5caa;color:#ffd700;text-align:center;padding:10px;font-weight:bold;}#login{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;}.login-kart{background:white;padding:30px;border-radius:15px;width:100%;max-width:380px;}.login-btn{width:100%;padding:12px;background:#2a5caa;color:#ffd700;border:none;border-radius:8px;font-weight:bold;cursor:pointer;}.menu-box{width:100%;max-width:900px;margin:15px auto;background:#c0c0c0;padding:15px;border-radius:10px;}.menu-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}.kart{background:#fff;border-radius:10px;text-align:center;padding:20px 10px;cursor:pointer;}.sayfa{display:none;background:white;margin:10px;padding:15px;border-radius:10px;}.tablo{width:100%;border-collapse:collapse;}.tablo th{background:#2a5caa;color:white;padding:8px;}.tablo td{border:1px solid #ddd;padding:6px;cursor:pointer;}.btn{padding:10px 15px;margin:5px;cursor:pointer;border:none;background:#2a5caa;color:white;border-radius:6px;}.btn-sil{background:#dc3545;}@media screen and (min-width:768px){.menu-grid{grid-template-columns:repeat(4,1fr);}}</style>
</head>
<body>
<div class="ust">METAL BAŞLIK V10 - BULUT<br>KULLANICI: <span id="kullaniciAdi">ADMIN</span></div>

<div id="login"><div class="login-kart"><h2>GİRİŞ YAP</h2><input id="kullanici" placeholder="Kullanıcı Adı" value="admin"><input type="password" id="sifre" placeholder="Şifre" value="1234"><button onclick="giris()" class="login-btn">GİRİŞ YAP</button></div></div>

<div id="main" style="display:none;"><div class="menu-box"><div class="menu-grid">
<div class="kart" onclick="sayfaAc('stok')"><b>Malzeme Listesi</b></div>
<div class="kart" onclick="sayfaAc('kullanici')"><b>Kullanıcı Yönetimi</b></div>
<div class="kart" onclick="alert('Buluta otomatik kayıt')"><b>Bulut Yedek</b></div>
<div class="kart" onclick="cikisYap()"><b>Çıkış Yap</b></div>
</div></div></div>

<div id="stok" class="sayfa"><button class="btn" onclick="anaMenu()"><- GERİ</button><h3>YEDEK MALZEME</h3><button class="btn" onclick="yeniUrun()">+ YENİ</button><table class="tablo"><thead><tr><th>Kod</th><th>Ad</th><th>Depo</th></tr></thead><tbody id="tablo"></tbody></table><div id="detay"></div></div>

<div id="kullanici" class="sayfa"><button class="btn" onclick="anaMenu()"><- GERİ</button><h3>KULLANICI</h3><table class="tablo"><tbody id="kullaniciTablo"></tbody></table><input id="yeniKadi" placeholder="Kullanıcı"><input id="yeniSifre" placeholder="Şifre"><button class="btn" onclick="kullaniciEkle()">EKLE</button></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// BURAYA_YAPISTIR - Firebase kodunu buraya yapıştır
const firebaseConfig = {
  SENIN_KODUN_BURAYA
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let urunler = []; let kullanicilar = []; let secili=0;

async function verileriYukle(){
  urunler = []; kullanicilar = [];
  const uSnap = await getDocs(collection(db, "urunler"));
  uSnap.forEach(d=>urunler.push({id:d.id, ...d.data()}));
  const kSnap = await getDocs(collection(db, "kullanicilar"));
  kSnap.forEach(d=>kullanicilar.push({id:d.id, ...d.data()}));
  if(kullanicilar.length==0) await addDoc(collection(db,"kullanicilar"),{kadi:"admin",sifre:"1234"});
  listele();
}

function giris(){let k=kullanicilar.find(x=>x.kadi==kullanici.value&&x.sifre==sifre.value);if(k){login.style.display='none';main.style.display='block';kullaniciAdi.innerText=k.kadi.toUpperCase();verileriYukle();}else alert("Hatalı")}
function cikisYap(){main.style.display='none';login.style.display='flex';}
function sayfaAc(id){main.style.display='none';document.querySelectorAll('.sayfa').forEach(s=>s.style.display='none');document.getElementById(id).style.display='block';}
function anaMenu(){document.querySelectorAll('.sayfa').forEach(s=>s.style.display='none');main.style.display='block';}

function listele(){tablo.innerHTML="";urunler.forEach((u,i)=>tablo.innerHTML+=`<tr onclick="detayGoster(${i})"><td>${u.kod}</td><td>${u.ad}</td><td>${u.depo||0}</td></tr>`);}
async function yeniUrun(){let ref=await addDoc(collection(db,"urunler"),{kod:"MB-"+(urunler.length+1),ad:"YENİ",depo:0});verileriYukle();}
async function detayGoster(i){secili=i;detay.innerHTML=`<h4>${urunler[i].ad}</h4><input id="ad" value="${urunler[i].ad}"><input id="depo" type="number" value="${urunler[i].depo||0}"><button class="btn" onclick="guncelle()">KAYDET</button><button class="btn btn-sil" onclick="silUrun()">SİL</button>`;}
async function guncelle(){await updateDoc(doc(db,"urunler",urunler[secili].id),{ad:ad.value,depo:parseFloat(depo.value)});verileriYukle();}
async function silUrun(){await deleteDoc(doc(db,"urunler",urunler[secili].id));detay.innerHTML="";verileriYukle();}

function kullaniciListele(){kullaniciTablo.innerHTML="";kullanicilar.forEach(k=>kullaniciTablo.innerHTML+=`<tr><td>${k.kadi}</td></tr>`);}
async function kullaniciEkle(){await addDoc(collection(db,"kullanicilar"),{kadi:yeniKadi.value,sifre:yeniSifre.value});verileriYukle();}

</script>
</body></html>

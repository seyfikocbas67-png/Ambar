<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Ambar Giriş</title>
  <style>
    body { font-family: Arial; background: #f2f2f2; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .login-box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px #ccc; width: 300px; }
    input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
    button:hover { background: #218838; }
    h2 { text-align: center; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Ambar Giriş</h2>
    <input type="text" id="username" placeholder="Kullanıcı Adı">
    <input type="password" id="password" placeholder="Şifre">
    <button onclick="login()">Giriş Yap</button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBwUM5k1Yy5J3nScnPQLF",
      authDomain: "metalbasliambar.firebaseapp.com",
      projectId: "metalbasliambar",
      storageBucket: "metalbasliambar.appspot.com",
      messagingSenderId: "112168412666",
      appId: "1:112168412666:web:88521a971d06b5d941866"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function login() {
      const kadi = document.getElementById("username").value;
      const sifre = document.getElementById("password").value;

      if(kadi == "" || sifre == "") {
        alert("Kullanıcı adı ve şifre boş olamaz!");
        return;
      }

      try {
        const q = db.collection("kullanicilar").where("kadi", "==", kadi).where("sifre", "==", sifre);
        const querySnapshot = await q.get();
        
        if (!querySnapshot.empty) {
          alert("Giriş başarılı! Panel yükleniyor...");
        } else {
          alert("Kullanıcı adı veya şifre hatalı!");
        }
      } catch (error) {
        alert("BAĞLANTI HATASI: " + error.message);
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Giriş</title>
<style>
body{font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh;background:#f0f0f0}
.kutu{background:white;padding:30px;border-radius:10px;box-shadow:0 0 15px #ccc;width:300px}
input{width:100%;padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:5px}
button{width:100%;padding:12px;background:#007bff;color:white;border:none;border-radius:5px;cursor:pointer}
#mesaj{text-align:center;margin-top:10px;font-weight:bold}
</style>
</head>
<body>

<div class="kutu">
<h2 style="text-align:center">Yönetici Girişi</h2>
<input type="text" id="kadi" placeholder="Kullanıcı Adı">
<input type="password" id="sifre" placeholder="Şifre">
<button onclick="girisYap()">Giriş Yap</button>
<p id="mesaj"></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDlBCI9XmeqKX3pl5_3kyu5rgpqVSspdVI",
  authDomain: "metalbaslikambar-94c7e.firebaseapp.com",
  projectId: "metalbaslikambar-94c7e",
  storageBucket: "metalbaslikambar-94c7e.firebasestorage.app",
  messagingSenderId: "313915466857",
  appId: "1:313915466857:web:bb87fcac0c07dfbd02eef8",
  measurementId: "G-X6YFMY86KX"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.girisYap = async function() {
  const kadi = document.getElementById('kadi').value;
  const sifre = document.getElementById('sifre').value;
  const mesaj = document.getElementById('mesaj');
  mesaj.innerText = "Kontrol ediliyor...";

  const ref = doc(db, "kullanicilar", "admin123");
  const snap = await getDoc(ref);

  if (snap.exists()) {
    const data = snap.data();
    if (data.kadi === kadi && data.sifre === sifre) {
      mesaj.style.color = "green";
mesaj.innerText = "Başarılı! Yönlendiriliyor...";
setTimeout(() => {
  window.location.href = "panel.html";
}, 1500);;
    } else {
      mesaj.style.color = "red";
      mesaj.innerText = "Kullanıcı adı veya şifre hatalı";
    }
  } else {
    mesaj.style.color = "red";
    mesaj.innerText = "Kullanıcı bulunamadı";
  }
}
</script>

</body>
</html>

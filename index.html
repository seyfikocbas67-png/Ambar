<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metal Başlık Ambar - Admin</title>
<style>
* {margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', sans-serif;}
body {height:100vh; background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); display:flex; justify-content:center; align-items:center;}
.glass {width: 90%; max-width: 400px; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.2); padding: 40px 30px;}
.logo {text-align:center; font-size:24px; font-weight:700; color:#fff; margin-bottom:30px; letter-spacing:2px;}
.input-group input {width:100%; padding:15px; margin-bottom:20px; background: rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.3); border-radius:10px; color:#fff; font-size:16px; outline:none;}
.input-group input::placeholder {color: rgba(255,255,255,0.6);}
.btn {width:100%; padding:15px; background: linear-gradient(90deg, #00c6ff, #0072ff); border:none; border-radius:10px; color:#fff; font-size:18px; font-weight:600; cursor:pointer;}
#mesaj {text-align:center; margin-top:15px; font-weight:600; height:20px; color:#fff;}
</style>
</head>
<body>

<div class="glass">
  <div class="logo">METAL BAŞLIK AMBAR</div>
  <div class="input-group">
    <input type="text" id="kadi" placeholder="Kullanıcı Adı">
  </div>
  <div class="input-group">
    <input type="password" id="sifre" placeholder="Şifre">
  </div>
  <button class="btn" id="girisyapBtn">GİRİŞ YAP</button>
  <p id="mesaj"></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDlBCI9XmeqKX3pl5_3kyu5rgpqVSspdVI",
  authDomain: "metalbaslikambar-94c7e.firebaseapp.com",
  projectId: "metalbaslikambar-94c7e",
  storageBucket: "metalbaslikambar-94c7e.firebasestorage.app",
  messagingSenderId: "313915466857",
  appId: "1:313915466857:web:bb87fcac0c07dfbd02eef8",
  measurementId: "G-X6YFMY86KX"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// BUTONA TIKLAMAYI BURADAN YAKALIYORUZ
document.getElementById('girisyapBtn').addEventListener('click', girisYap);

async function girisYap() {
  const kadi = document.getElementById('kadi').value;
  const sifre = document.getElementById('sifre').value;
  const mesaj = document.getElementById('mesaj');
  mesaj.innerText = "Kontrol ediliyor...";

  try {
    const ref = doc(db, "kullanicilar", "admin123");
    const snap = await getDoc(ref);

    if (snap.exists()) {
      const data = snap.data();
      if (data.kadi === kadi && data.sifre === sifre) {
        mesaj.style.color = "#00ff88";
        mesaj.innerText = "Başarılı! Yönlendiriliyor...";
        setTimeout(() => { window.location.replace("panel.html"); }, 1200);
      } else {
        mesaj.style.color = "#ff4d4d";
        mesaj.innerText = "Kullanıcı adı veya şifre hatalı";
      }
    } else {
      mesaj.style.color = "#ff4d4d";
      mesaj.innerText = "Kullanıcı bulunamadı";
    }
  } catch(e) {
    mesaj.style.color = "#ff4d4d";
    mesaj.innerText = "HATA: " + e.message;
  }
}
</script>

</body>
</html>

.modal-icerik{background:var(--kart);padding:25px;border-radius:15px;width:90%;max-width:500px;}
@media(min-width:768px){.menu-grid{grid-template-columns:repeat(4,1fr);}.stats{grid-template-columns:repeat(4,1fr);}}
</style>
</head>

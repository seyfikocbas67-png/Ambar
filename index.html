<!DOCTYPE html>
<html lang="tr">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ambar Pro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>body{font-family:Arial; margin:0; background:#f4f4f4;} .box{max-width:600px; margin:20px auto; padding:15px; background:white; border-radius:10px;} .btn{width:100%; padding:14px; margin:8px 0; font-size:16px; background:#007bff; color:white; border:none; border-radius:8px;} input,select{width:96%; padding:10px; margin:5px 0; border:1px solid #ccc; border-radius:5px;} #reader{width:100%;} .kritik{background:#ffcccc;}</style>
</head>
<body>
<div class="box" id="login"><h2>🔒 Giriş</h2><select id="kullanici"></select><input type="password" id="sifre" placeholder="Şifre"><button class="btn" onclick="giris()">Giriş</button></div>
<div class="box" id="main" style="display:none"><h2>🏭 Anasayfa - <span id="kadi"></span></h2><button class="btn" onclick="goster('stok')">Stok Durumu</button><button class="btn" onclick="goster('giris')">Malzeme Girişi</button><button class="btn" onclick="goster('cikis')">Malzeme Çıkışı</button><button class="btn" onclick="goster('barkod')">📷 Barkod Oku</button><button class="btn" onclick="goster('kullanici')">Kullanıcı Ekle</button><button class="btn" style="background:red" onclick="cikis()">Çıkış</button><div id="icerik"></div></div>
<script>const { jsPDF } = window.jspdf;let kullanicilar = JSON.parse(localStorage.getItem('kullanicilar')) || [{kadi:"admin", sifre:"1234", yetki:"Yonetici"}];let urunler = JSON.parse(localStorage.getItem('urunler')) || [{kod:"YP-001", ad:"Rulman 6204", stok:8, min:5}];function kaydet(){localStorage.setItem('kullanicilar',JSON.stringify(kullanicilar)); localStorage.setItem('urunler',JSON.stringify(urunler));}
window.onload = function(){kullanicilar.forEach(u=>document.getElementById('kullanici').innerHTML+=`<option>${u.kadi}</option>`)}
function giris(){let k=document.getElementById('kullanici').value; let s=document.getElementById('sifre').value; let u=kullanicilar.find(x=>x.kadi==k && x.sifre==s); if(u){document.getElementById('login').style.display='none'; document.getElementById('main').style.display='block'; document.getElementById('kadi').innerText=u.kadi;} else alert("Hatalı")}function cikis(){document.getElementById('login').style.display='block'; document.getElementById('main').style.display='none';}
function goster(s){let html="";if(s=='stok'){html="<h3>Stok</h3><table border=1 width=100%><tr><th>Kod</th><th>Ad</th><th>Stok</th></tr>"; urunler.forEach(u=>html+=`<tr class='${u.stok<u.min?"kritik":""}'><td>${u.kod}</td><td>${u.ad}</td><td>${u.stok}</td></tr>`); html+="</table><button class=btn onclick='pdfCikis()'>PDF Fiş İndir</button>"}if(s=='giris'){html=`<h3>Giriş</h3>Kod:<input id=gk> Miktar:<input id=gm type=number><button class=btn onclick="islem('giris')">Kaydet</button>`}if(s=='cikis'){html=`<h3>Çıkış</h3>Kod:<input id=ck> Miktar:<input id=cm type=number><button class=btn onclick="islem('cikis')">Kaydet</button>`}if(s=='barkod'){html=`<h3>Barkod Oku</h3><div id=reader></div><p>Okunan Kod: <b id=bkod></b></p>`; setTimeout(()=>{new Html5QrcodeScanner("reader",{fps:10}).render(q=>{document.getElementById('bkod').innerText=q})},200)}if(s=='kullanici'){html=`<h3>Yeni Kullanıcı</h3>K.Adı:<input id=nk> Şifre:<input id=ns> Yetki:<select id=ny><option>Personel</option><option>Yonetici</option></select><button class=btn onclick="kEkle()">Ekle</button>`}document.getElementById('icerik').innerHTML=html;}function islem(t){let k=document.getElementById(t[0]+'k').value; let m=parseFloat(document.getElementById(t[0]+'m').value); let u=urunler.find(x=>x.kod==k); if(!u)return alert("Ürün Yok"); if(t=='cikis' && u.stok<m)return alert("Stok yetersiz"); if(t=='giris') u.stok+=m; else u.stok-=m; kaydet(); alert("Kaydedildi"); goster('stok')}function kEkle(){let nk=document.getElementById('nk').value; let ns=document.getElementById('ns').value; let ny=document.getElementById('ny').value; kullanicilar.push({kadi:nk,sifre:ns,yetki:ny}); kaydet(); alert("Kullanıcı Eklendi");document.getElementById('kullanici').innerHTML+=`<option>${nk}</option>`}function pdfCikis(){const doc = new jsPDF(); doc.text("Ambar Stok Fişi - " + new Date().toLocaleDateString(), 10, 10); let y=20; urunler.forEach(u=>{doc.text(`${u.kod} - ${u.ad} - Stok: ${u.stok}`,10,y); y+=10}); doc.save("ambar_fisi.pdf");}</script></body></html>

<!DOCTYPE html>
<html lang="tr">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRO AMBAR TAKİP</title>

<style>
body{font-family:'Segoe UI'; margin:0; background:#f0f0f0;}
.header{background:#0d6efd; color:white; padding:10px; font-size:18px; font-weight:bold;}
.main{display:flex; height:90vh;}
.sol{width:60%; background:white; padding:10px; overflow:auto;}
.sag{width:40%; background:#eef2f7; padding:10px; border-left:2px solid #ccc;}
input,select{padding:5px; margin:3px; border:1px solid #ccc; border-radius:4px;}
.btn{padding:7px 12px; margin:3px; border:none; border-radius:4px; cursor:pointer; color:white;}
.btn-ekle{background:#198754;} .btn-sil{background:#dc3545;} .btn-pdf{background:#0d6efd;}
.tablo{width:100%; border-collapse:collapse; font-size:13px;}
.tablo th{background:#0d6efd; color:white; padding:8px; position:sticky; top:0;}
.tablo td{border:1px solid #ddd; padding:6px; cursor:pointer;}
.tablo tr:hover{background:#e7f1ff;}
.tablo tr.secili{background:#cfe2ff;}
.resim-alani{width:100%; height:250px; border:2px dashed #ccc; background:white; display:flex; align-items:center; justify-content:center; margin-bottom:10px;}
.resim-alani img{max-width:100%; max-height:100%;}
.stoklar{display:grid; grid-template-columns:1fr 1fr 1fr; gap:5px; text-align:center;}
.stok-kutu{background:white; padding:10px; border-radius:5px; border:1px solid #ccc;}
.stok-kutu b{font-size:20px;}
</style>
</head>

<button class="btn btn-ekle" onclick="giris()">GİRİŞ</button></div>

<button class="btn btn-pdf" onclick="pdfCikis()">PDF Rapor</button>
</div>

<div class="sag" id="detay">
<h3>Malzeme Detayı</h3>
<div class="resim-alani" id="resimAlani">Resim Yok<br><input type="file" id="resimYukle" accept="image/*" onchange="resimEkle(event)"></div>

<label>Adı:</label><input id="ad"><br>

<label>Kritik Seviye:</label><input id="min" type="number"><br><hr>
<div class="stoklar">

<div class="stok-kutu">DEPO<br><b id="depo">0</b></div>
<div class="stok-kutu">ELİMDE<br><b id="elde">0</b></div>
</div><br>
<h4>Stok İşlemi</h4>
<select id="tur">

<option value="eldeye_ver">Depodan Elime</option>
<option value="kullanildi">Elimdekini Kullan</option>
</select>
<input id="miktar" type="number" value="1" style="width:60px">
<button class="btn btn-ekle" onclick="islemYap()">Kaydet</button>
</div>
</div>

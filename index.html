<!DOCTYPE html>
<html lang="tr">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Metal Başlık Malzeme Takip</title>
<style>
*{box-sizing:border-box;}
body{font-family:Tahoma; margin:0; background:#808080; font-size:14px;}
.ust{background:#2a5caa; color:#ffd700; text-align:center; padding:8px; font-weight:bold; font-size:14px;}
.menu-box{width:100%; margin:10px 0; background:#c0c0c0; padding:8px; border:3px outset #fff;}
.menu-grid{display:grid; grid-template-columns:repeat(2, 1fr); gap:6px;}
.kart{background:#fff; border:2px outset #fff; text-align:center; padding:15px 5px; cursor:pointer; font-size:11px;}
.kart:hover{border:2px inset #fff; background:#ffff99;}
.kart img{width:35px; height:35px;}
.kart.sari{background:#ffff99;}
.alt{color:#ffd700; text-align:center; padding:8px; font-weight:bold; font-size:12px;}
#login{padding:30px 20px; text-align:center; background:white; width:95%; max-width:350px; margin:30px auto; border:2px outset #fff;}
#login input{width:90%; padding:8px; margin:5px 0;}
#stokEkrani, #kullaniciEkrani{display:none; background:white; margin:5px; padding:8px; overflow-x:auto;}
.tablo{width:100%; border-collapse:collapse; font-size:11px; min-width:500px;}
.tablo th{background:#2a5caa; color:white; padding:5px;}
.tablo td{border:1px solid #999; padding:4px; cursor:pointer;}
.tablo tr:hover{background:#ffff99;}
.tablo tr.secili{background:#cfe2ff;}
.resim-alani{width:100%; height:140px; border:2px dashed #999; background:#eee; display:flex; align-items:center; justify-content:center; margin-bottom:5px;}
.resim-alani img{max-width:100%; max-height:100%;}
.btn{padding:8px 10px; margin:3px; cursor:pointer; border:1px outset #ccc; background:#c0c0c0; font-size:12px;}
.btn:hover{border:1px inset #ccc;}
.btn-sil{background:#dc3545; color:white;}
.stoklar{display:grid; grid-template-columns:1fr 1fr; gap:5px; text-align:center;}
.stok-kutu{background:#eef; padding:8px; border:1px solid #999;}
input, select{padding:6px; margin:3px; font-size:13px; max-width:100%;}
@media screen and (min-width:768px){
 .menu-grid{grid-template-columns:repeat(4, 1fr);}
 .tablo{font-size:13px; min-width:100%;}
  #login{width:400px;}
}
</style>
</head>
<body>

<div class="ust">
METAL BAŞLIK MALZEME TAKİP<br>
KULLANICI: <span id="kullaniciAdi">ADMIN</span>
</div>

<div id="login">
<h3>GİRİŞ EKRANI</h3>
Kullanıcı Adı:<br><input id="kullanici" value="admin"><br>
Şifre:<br><input type="password" id="sifre" value="1234"><br><br>
<button onclick="giris()" class="btn" style="background:#2a5caa; color:#ffd700; width:90%;">GİRİŞ YAP</button>
</div>

<div id="main" style="display:none;">
<div class="menu-box">
<div class="menu-grid">
<div class="kart sari" onclick="stokAc()"><img src="https://cdn-icons-png.flaticon.com/512/3081/3081559.png"><br><b>Malzeme Listesi</b></div>
<div class="kart" onclick="kullaniciAc()"><img src="https://cdn-icons-png.flaticon.com/512/1077/1077114.png"><br><b>Kullanıcılar</b></div>
<div class="kart" onclick="pdfRapor()"><img src="https://cdn-icons-png.flaticon.com/512/2103/2103633.png"><br><b>PDF Rapor</b></div>
<div class="kart" onclick="excelAktar()"><img src="https://cdn-icons-png.flaticon.com/512/337/337946.png"><br><b>Excel Aktar</b></div>

<div class="kart" onclick="kaydet()"><img src="https://cdn-icons-png.flaticon.com/512/3767/3767084.png"><br><b>Kaydet</b></div>
<div class="kart" onclick="alert('Ana Menü')"><img src="https://cdn-icons-png.flaticon.com/512/1828/1828665.png"><br><b>Ana Menü</b></div>
<div class="kart" onclick="alert('Destek: 0555 555 55 55')"><img src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png"><br><b>Destek</b></div>
<div class="kart" onclick="window.close()"><img src="https://cdn-icons-png.flaticon.com/512/1828/1828427.png"><br><b>Çıkış</b></div>
</div>
</div>
<div class="alt">METAL BAŞLIK AMBAR</div>

<div id="stokEkrani">
<h3>YEDEK MALZEME LİSTESİ</h3>
<input id="arama" placeholder="Ara..." onkeyup="listele()" style="width:60%">
<button class="btn" onclick="yeniUrun()">+ YENİ</button>
<div style="overflow-x:auto;">
<table class="tablo"><thead><tr><th>Kod</th><th>Adı</th><th>Depo</th><th>Mak</th><th>Top</th></tr></thead><tbody id="tablo"></tbody></table>
</div>
<hr>
<div id="detay"></div>
</div>

<div id="kullaniciEkrani">
<h3>KULLANICI YÖNETİMİ</h3>
<div style="overflow-x:auto;">
<table class="tablo"><thead><tr><th>Kullanıcı</th><th>Şifre</th><th>İşlem</th></tr></thead><tbody id="kullaniciTablo"></tbody></table>
</div>
<hr>
<h4>Yeni Kullanıcı</h4>
<input id="yeniKadi" placeholder="Kullanıcı Adı">
<input id="yeniSifre" type="password" placeholder="Şifre">
<button class="btn" onclick="kullaniciEkle()">EKLE</button>
</div>

</div>

<script>
const MAKINELER = ["BMW NUMALLIANCE","BJA NUMALLIANCE","BAŞARAN 1","BAŞARAN 2","BAŞARAN 3"];
let jsPDF_loaded = false; let XLSX_loaded = false;

let urunler = JSON.parse(localStorage.getItem('metalbaslik_v87_urun')) || [
  {kod:"MB-001", ad:"RULMAN 6204", birim:"ADET", min:5, depo:10, makine:{"BMW NUMALLIANCE":2}, resim:""}
];
let kullanicilar = JSON.parse(localStorage.getItem('metalbaslik_v87_kul')) || [
  {kadi:"admin", sifre:"1234"}
];
let secili=0; let aktifKullanici="admin";

function kaydet(){
  localStorage.setItem('metalbaslik_v87_urun',JSON.stringify(urunler));
  localStorage.setItem('metalbaslik_v87_kul',JSON.stringify(kullanicilar));
  alert("Kaydedildi")
}

function giris(){
  let k = kullanicilar.find(x=>x.kadi==kullanici.value && x.sifre==sifre.value);
  if(k){
    aktifKullanici = k.kadi;
    document.getElementById('login').style.display='none';
    document.getElementById('main').style.display='block';
    document.getElementById('kullaniciAdi').innerText = aktifKullanici.toUpperCase();
    setTimeout(loadLibs, 1000);
  } else alert("Hatalı giriş")
}

function loadLibs(){
  if(!jsPDF_loaded) loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js", ()=>{jsPDF_loaded=true});
  if(!XLSX_loaded) loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js", ()=>{XLSX_loaded=true});
}
function loadScript(src, callback){
  var s = document.createElement('script');
  s.src = src;
  s.onload = callback;
  document.head.appendChild(s);
}

function stokAc(){document.getElementById('stokEkrani').style.display='block'; document.getElementById('kullaniciEkrani').style.display='none'; listele();}
function kullaniciAc(){document.getElementById('kullaniciEkrani').style.display='block'; document.getElementById('stokEkrani').style.display='none'; kullaniciListele();}

function kullaniciListele(){
  kullaniciTablo.innerHTML="";
  kullanicilar.forEach((k,i)=>{
    let silBtn = k.kadi=="admin"? "" : `<button class="btn btn-sil" onclick="kullaniciSil(${i})">SİL</button>`;
    kullaniciTablo.innerHTML += `<tr><td>${k.kadi}</td><td>****</td><td>${silBtn}</td></tr>`;
  })
}
function kullaniciEkle(){
  if(!yeniKadi.value ||!yeniSifre.value) return alert("Boş bırakma");
  if(kullanicilar.find(x=>x.kadi==yeniKadi.value)) return alert("Var");
  kullanicilar.push({kadi:yeniKadi.value, sifre:yeniSifre.value});
  kaydet(); kullaniciListele(); yeniKadi.value=""; yeniSifre.value="";
}
function kullaniciSil(i){if(confirm("Sil?")){kullanicilar.splice(i,1); kaydet(); kullaniciListele();}}

function listele(){
  tablo.innerHTML="";
  urunler.filter(u=>u.kod.toLowerCase().includes(arama.value.toLowerCase())||u.ad.toLowerCase().includes(arama.value.toLowerCase()))
.forEach((u,i)=>{
    let makineToplam = Object.values(u.makine).reduce((a,b)=>a+b,0);
    let toplam = u.depo + makineToplam;
    tablo.innerHTML += `<tr onclick="detayGoster(${i})" class="${i==secili?'secili':''}">
    <td>${u.kod}</td><td>${u.ad}</td><td>${u.depo}</td><td>${makineToplam}</td><td><b>${toplam}</b></td></tr>`;
  })
}

function detayGoster(i){
  secili=i; let u=urunler[i];
  let makineToplam = Object.values(u.makine).reduce((a,b)=>a+b,0);
  let makineSelect = '<select id="makineSec">';
  MAKINELER.forEach(m=>makineSelect+=`<option>${m}</option>`);
  makineSelect += '</select>';

  detay.innerHTML = `<h4>${u.ad}</h4>
  <div class="resim-alani" id="resimAlani">${u.resim?`<img src="${u.resim}">`:'Resim Yok'}</div>
  <input type="file" accept="image/*" onchange="resimEkle(event)"><br>
  <label>Kod:</label><input id="kod" value="${u.kod}">
  <label>Ad:</label><input id="ad" value="${u.ad}">
  <label>Birim:</label><select id="birim"><option>ADET</option><option>KG</option><option>MT</option></select>
  <label>Kritik:</label><input id="min" type="number" value="${u.min}" size="4"><br>
  <div class="stoklar">
  <div class="stok-kutu">DEPO<br><b>${u.depo}</b></div>
  <div class="stok-kutu">MAKİNE<br><b>${makineToplam}</b></div>
  </div><br>
  <h4>Stok Hareketi</h4>
  ${makineSelect}<br>
  <select id="tur">
    <option value="depoya_gir">Depoya Giriş</option>
    <option value="makineye_gir">Depodan Makineye</option>
    <option value="makineden_depo">Makineden Depoya</option>
  </select><br>
  <input id="miktar" type="number" value="1" size="4">
  <button class="btn" onclick="islemYap()">STOK İŞLE</button>
  <button class="btn" onclick="guncelle()">KAYDET</button>
  <button class="btn btn-sil" onclick="silUrun()">SİL</button>`;
  birim.value = u.birim;
}

function guncelle(){
  urunler[secili].kod=kod.value; urunler[secili].ad=ad.value;
  urunler[secili].birim=birim.value; urunler[secili].min=parseFloat(min.value)||0;
  kaydet(); listele(); detayGoster(secili);
}

function yeniUrun(){
  urunler.push({kod:"MB-"+(urunler.length+1), ad:"YENİ MALZEME", birim:"ADET", min:1, depo:0, makine:{}, resim:""});
  kaydet(); listele(); detayGoster(urunler.length-1);
}
function silUrun(){if(confirm("Silinsin mi?")){urunler.splice(secili,1); kaydet(); listele(); detay.innerHTML="";}}

function islemYap(){
  let u=urunler[secili]; let m=parseFloat(miktar.value)||0; let t=tur.value; let mk=makineSec.value;
  if(!u.makine[mk]) u.makine[mk]=0;

  if(t=='depoya_gir')u.depo+=m;
  if(t=='makineye_gir'){if(u.depo<m)return alert("Depo yetersiz"); u.depo-=m; u.makine[mk]+=m;}
  if(t=='makineden_depo'){if(u.makine[mk]<m)return alert("Makinede yok"); u.makine[mk]-=m; u.depo+=m;}
  kaydet(); detayGoster(secili); listele();
}

function resimEkle(e){let r=new FileReader(); r.onload=()=>{urunler[secili].resim=r.result; kaydet(); detayGoster(secili)}; r.readAsDataURL(e.target.files[0]);}

function pdfRapor(){
  if(!jsPDF_loaded) return alert("Yükleniyor 5sn bekle");
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.text("METAL BAŞLIK RAPORU", 10, 10);
  let y=20;
  urunler.forEach(u=>{
    let makineToplam = Object.values(u.makine).reduce((a,b)=>a+b,0);
    doc.text(`${u.kod} - ${u.ad} - D:${u.depo} M:${makineToplam}`,10,y); y+=10
  });
  doc.save("Rapor.pdf");
}

function excelAktar(){
  if(!XLSX_loaded) return alert("Yükleniyor 5sn bekle");
  let data = urunler.map(u=>({
    Kod:u.kod, Ad:u.ad, Birim:u.birim, Depo:u.depo,
    "Makine":Object.values(u.makine).reduce((a,b)=>a+b,0), "Kritik":u.min
  }));
  let ws = XLSX.utils.json_to_sheet(data);
  let wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Malzemeler");
  XLSX.writeFile(wb, "Malzeme.xlsx");
}
</script>
</body></html>

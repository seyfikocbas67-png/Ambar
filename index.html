<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metal Başlık Malzeme Takip</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --secondary-color: #1e40af;
            --accent-color: #f59e0b;
            --bg-color: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-color: #1e293b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: var(--text-color); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 10px; }
        
        .app-header { background: linear-gradient(90deg, #f59e0b, #d97706); color: white; width: 100%; max-width: 600px; padding: 12px; text-align: center; font-weight: bold; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); font-size: 1.1rem; }
        
        /* 3D Giriş Ekranı */
        #login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 75vh;
        }
        .login-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 15px rgba(245, 158, 11, 0.3);
            width: 100%;
            max-width: 400px;
            transform: perspective(1000px) rotateX(2deg);
            transition: transform 0.3s ease;
        }
        .login-card:hover { transform: perspective(1000px) rotateX(0deg) scale(1.02); }
        .login-card h2 { text-align: center; margin-bottom: 20px; color: #0f172a; font-size: 1.8rem; text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; color: #475569; }
        .form-group input { width: 100%; padding: 12px; border: 2px solid #cbd5e1; border-radius: 8px; font-size: 1rem; }
        .form-group input:focus { border-color: var(--primary-color); outline: none; box-shadow: 0 0 8px rgba(37, 99, 235, 0.3); }
        .btn-primary { width: 100%; padding: 12px; background: linear-gradient(90deg, #2563eb, #1d4ed8); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4); }
        .support-link { text-align: center; margin-top: 15px; font-size: 0.9rem; }
        .support-link a { color: #2563eb; text-decoration: none; font-weight: 600; }

        /* Ana Menü */
        #main-menu { display: none; width: 100%; max-width: 600px; }
        .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; width: 100%; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; text-align: center; cursor: pointer; box-shadow: 0 8px 20px rgba(0,0,0,0.2); transition: transform 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; border: 1px solid rgba(255,255,255,0.3); }
        .card:hover { transform: translateY(-3px); background: #ffffff; }
        .card span.icon { font-size: 2.5rem; }
        .card h3 { font-size: 1rem; color: #1e293b; font-weight: 600; }

        /* Tam Sayfa Görünümler */
        .full-page-view { display: none; width: 100%; max-width: 600px; background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); position: relative; margin-top: 10px; }
        .back-btn { position: absolute; top: 15px; right: 15px; background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.85rem; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .back-btn:hover { background: #dc2626; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.9rem; }
        th, td { border: 1px solid #cbd5e1; padding: 8px; text-align: left; }
        th { background: #f1f5f9; color: #334155; }
        .input-row { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
        .input-row input { flex: 1; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; min-width: 110px; }
        .btn-action { background: #10b981; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-danger { background: #ef4444; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
        .search-box { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="app-header" id="header-title">METAL BAŞLIK AMBAR TAKİP</div>

    <!-- GİRİŞ EKRANI -->
    <div id="login-screen">
        <div class="login-card">
            <h2>GİRİŞ EKRANI</h2>
            <div class="form-group">
                <label>Kullanıcı Adı:</label>
                <input type="text" id="login-user" placeholder="Kullanıcı adınız">
            </div>
            <div class="form-group">
                <label>Şifre:</label>
                <input type="password" id="login-pass" placeholder="Şifreniz">
            </div>
            <button class="btn-primary" onclick="girisYap()">GİRİŞ YAP</button>
            <div class="support-link">
                <a href="mailto:destek@ambartakip.com?subject=Hata%20Bildirimi">Destek / Hata Bildirimi</a>
            </div>
        </div>
    </div>

    <!-- ANA MENÜ -->
    <div id="main-menu">
        <div style="margin-bottom: 10px; font-weight: bold; color: #e2e8f0; text-align: center;" id="welcome-user">KULLANICI: ADMIN</div>
        <div class="menu-grid">
            <div class="card" onclick="openMalzemeListesi()">
                <span class="icon">📦</span>
                <h3>Malzeme Listesi</h3>
            </div>
            <div class="card" onclick="openKullaniciYonetimi()">
                <span class="icon">👤</span>
                <h3>Kullanıcılar</h3>
            </div>
            <div class="card" onclick="alert('PDF Rapor özelliği hazırlanıyor.')">
                <span class="icon">📄</span>
                <h3>PDF Rapor</h3>
            </div>
            <div class="card" onclick="alert('Excel Aktar özelliği hazırlanıyor.')">
                <span class="icon">📊</span>
                <h3>Excel Aktar</h3>
            </div>
            <div class="card" onclick="openMalzemeListesi()">
                <span class="icon">💾</span>
                <h3>Kaydet / Ekle</h3>
            </div>
            <div class="card" onclick="cikisYap()">
                <span class="icon">🚪</span>
                <h3>Çıkış</h3>
            </div>
        </div>
    </div>

    <!-- MALZEME LİSTESİ (Tam Sayfa) -->
    <div id="malzeme-view" class="full-page-view">
        <button class="back-btn" onclick="anaMenuyeDon()">Çıkış / Geri</button>
        <h3 style="margin-bottom: 15px; color: #1e293b;">YEDEK MALZEME LİSTESİ</h3>
        <input type="text" class="search-box" id="malzeme-search" placeholder="Malzeme ara..." onkeyup="filtreleMalzeme()">
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Kod</th>
                        <th>Adı</th>
                        <th>Depo</th>
                        <th>Makine</th>
                        <th>Toplam</th>
                        <th>İşlem</th>
                    </tr>
                </thead>
                <tbody id="malzeme-tbody"></tbody>
            </table>
        </div>
        <div class="input-row" style="margin-top: 20px;">
            <input type="text" id="yeni-kod" placeholder="Kod">
            <input type="text" id="yeni-ad" placeholder="Malzeme Adı">
            <input type="number" id="yeni-depo" placeholder="Depo" value="0">
            <input type="number" id="yeni-makine" placeholder="Makine" value="0">
            <button class="btn-action" onclick="malzemeEkle()">Ekle</button>
        </div>
    </div>

    <!-- KULLANICI YÖNETİMİ (Tam Sayfa) -->
    <div id="kullanici-view" class="full-page-view">
        <button class="back-btn" onclick="anaMenuyeDon()">Çıkış / Geri</button>
        <h3 style="margin-bottom: 15px; color: #1e293b;">KULLANICI YÖNETİMİ</h3>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Kullanıcı Adı</th>
                        <th>Şifre</th>
                        <th>İşlem</th>
                    </tr>
                </thead>
                <tbody id="kullanici-tbody"></tbody>
            </table>
        </div>
        <div class="input-row" style="margin-top: 20px;">
            <input type="text" id="yeni-kul-adi" placeholder="Kullanıcı Adı">
            <input type="password" id="yeni-kul-sifre" placeholder="Şifre">
            <button class="btn-action" onclick="kullaniciEkle()">Kullanıcı Ekle</button>
        </div>
    </div>

    <script>
        if (!localStorage.getItem('metal_malzemeler')) {
            localStorage.setItem('metal_malzemeler', JSON.stringify([
                { kod: 'MB-001', ad: 'RULMAN 6204', depo: 10, makine: 2 },
                { kod: 'MB-2', ad: 'YENİ MALZEME', depo: 0, makine: 0 }
            ]));
        }

        if (!localStorage.getItem('metal_kullanicilar')) {
            localStorage.setItem('metal_kullanicilar', JSON.stringify([
                { kadi: 'admin', sifre: '1234' }
            ]));
        }

        let aktifKullanici = '';

        function girisYap() {
            let kadi = document.getElementById('login-user').value.trim();
            let sifre = document.getElementById('login-pass').value.trim();
            let users = JSON.parse(localStorage.getItem('metal_kullanicilar'));

            let bul = users.find(u => u.kadi === kadi && u.sifre === sifre);
            if (bul) {
                aktifKullanici = bul.kadi;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-menu').style.display = 'block';
                document.getElementById('welcome-user').innerText = 'KULLANICI: ' + aktifKullanici.toUpperCase();
            } else {
                alert('Hatalı kullanıcı adı veya şifre!');
            }
        }

        function cikisYap() {
            aktifKullanici = '';
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('login-user').value = '';
            document.getElementById('login-pass').value = '';
        }

        function anaMenuyeDon() {
            document.getElementById('malzeme-view').style.display = 'none';
            document.getElementById('kullanici-view').style.display = 'none';
            document.getElementById('main-menu').style.display = 'block';
        }

        function openMalzemeListesi() {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('malzeme-view').style.display = 'block';
            listeleMalzeme();
        }

        function openKullaniciYonetimi() {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('kullanici-view').style.display = 'block';
            listeleKullanici();
        }

        function listeleMalzeme(filtre = '') {
            let list = JSON.parse(localStorage.getItem('metal_malzemeler'));
            let tbody = document.getElementById('malzeme-tbody');
            tbody.innerHTML = '';
            list.forEach((item, index) => {
                if (item.ad.toLowerCase().includes(filtre.toLowerCase()) || item.kod.toLowerCase().includes(filtre.toLowerCase())) {
                    let toplam = Number(item.depo) + Number(item.makine);
                    tbody.innerHTML += `<tr>
                        <td>${item.kod}</td>
                        <td>${item.ad}</td>
                        <td>${item.depo}</td>
                        <td>${item.makine}</td>
                        <td><b>${toplam}</b></td>
                        <td><button class="btn-danger" onclick="malzemeSil(${index})">Sil</button></td>
                    </tr>`;
                }
            });
        }

        function filtreleMalzeme() {
            let val = document.getElementById('malzeme-search').value;
            listeleMalzeme(val);
        }

        function malzemeEkle() {
            let kod = document.getElementById('yeni-kod').value.trim();
            let ad = document.getElementById('yeni-ad').value.trim();
            let depo = document.getElementById('yeni-depo').value;
            let makine = document.getElementById('yeni-makine').value;

            if (!kod || !ad) {
                alert('Lütfen kod ve malzeme adı giriniz.');
                return;
            }

            let list = JSON.parse(localStorage.getItem('metal_malzemeler'));
            list.push({ kod, ad, depo: Number(depo), makine: Number(makine) });
            localStorage.setItem('metal_malzemeler', JSON.stringify(list));

            document.getElementById('yeni-kod').value = '';
            document.getElementById('yeni-ad').value = '';
            document.getElementById('yeni-depo').value = '0';
            document.getElementById('yeni-makine').value = '0';
            listeleMalzeme();
            alert('Malzeme kaydedildi!');
        }

        function malzemeSil(index) {
            if (confirm('Silmek istediğinize emin misiniz?')) {
                let list = JSON.parse(localStorage.getItem('metal_malzemeler'));
                list.splice(index, 1);
                localStorage.setItem('metal_malzemeler', JSON.stringify(list));
                listeleMalzeme();
            }
        }

        function listeleKullanici() {
            let users = JSON.parse(localStorage.getItem('metal_kullanicilar'));
            let tbody = document.getElementById('kullanici-tbody');
            tbody.innerHTML = '';
            users.forEach((u, index) => {
                tbody.innerHTML += `<tr>
                    <td>${u.kadi}</td>
                    <td>••••</td>
                    <td>${u.kadi !== 'admin' ? `<button class="btn-danger" onclick="kullaniciSil(${index})">Sil</button>` : 'Sabit'}</td>
                </tr>`;
            });
        }

        function kullaniciEkle() {
            let kadi = document.getElementById('yeni-kul-adi').value.trim();
            let sifre = document.getElementById('yeni-kul-sifre').value.trim();

            if (!kadi || !sifre) {
                alert('Kullanıcı adı ve şifre boş olamaz.');
                return;
            }

            let users = JSON.parse(localStorage.getItem('metal_kullanicilar'));
            if (users.some(u => u.kadi === kadi)) {
                alert('Bu kullanıcı adı zaten var!');
                return;
            }

            users.push({ kadi, sifre });
            localStorage.setItem('metal_kullanicilar', JSON.stringify(users));
            document.getElementById('yeni-kul-adi').value = '';
            document.getElementById('yeni-kul-sifre').value = '';
            listeleKullanici();
            alert('Kullanıcı eklendi!');
        }

        function kullaniciSil(index) {
            if (confirm('Kullanıcıyı silmek istediğinize emin misiniz?')) {
                let users = JSON.parse(localStorage.getItem('metal_kullanicilar'));
                users.splice(index, 1);
                localStorage.setItem('metal_kullanicilar', JSON.stringify(users));
                listeleKullanici();
            }
        }
    </script>
</body>
</html>

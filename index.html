<body>

  <a href="stok.html">Stok</a>

  <button onclick="cikis()" style="width:auto;float:right;background:red">Çıkış Yap</button>
</nav>

<h2>👥 Kullanıcı Yönetimi</h2>

<div class="kutu">
  <h3>➕ Yeni Kullanıcı Ekle</h3>
  <input id="yeniKadi" placeholder="Kullanıcı Adı">
  <input id="yeniSifre" type="password" placeholder="Şifre">
  <select id="yeniRol">
    <option value="LIMITED">Personel</option>
    <option value="ADMIN">Yönetici</option>
  </select>
  <button onclick="ekle()">Kullanıcı Ekle</button>
  <p id="mesaj" style="color:#00ff88"></p>
</div>

<div class="kutu">
  <h3>📋 Mevcut Kullanıcılar</h3>
  <table id="tablo"><tr><th>Kullanıcı Adı</th><th>Yetki</th><th>İşlem</th></tr></table>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {apiKey: "SENIN_APIKEYIN", authDomain: "metalbaslikambar.firebaseapp.com", projectId: "metalbaslikambar"};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Yetki kontrolü
if(localStorage.getItem("rol") !== "ADMIN"){
  alert("Bu sayfaya erişim yetkiniz yok!");
  window.location.href = "depo.html";
}

async function listele(){
  const tablo = document.getElementById('tablo');
  tablo.innerHTML = "<tr><th>Kullanıcı Adı</th><th>Yetki</th><th>İşlem</th></tr>";
  const snap = await getDocs(collection(db, "kullanicilar"));
  snap.forEach(d => {
    const yetki = d.data().rol === "ADMIN" ? "Yönetici" : "Personel";
    tablo.innerHTML += `<tr><td>${d.data().kadi}</td><td>${yetki}</td>
    <td><button class="sil" onclick="sil('${d.id}')">Sil</button></td></tr>`;
  });
}

  const kadi = document.getElementById('yeniKadi').value;
  const sifre = document.getElementById('yeniSifre').value;

    kadi: kadi, sifre: sifre, rol: document.getElementById('yeniRol').value
  });

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metal Başlık V10 Giriş</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#1a1a1a;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.login-card{background:#2a2a2a;padding:30px;border-radius:10px;width:300px;text-align:center}
input{width:100%;padding:10px;margin:10px 0;border:none;border-radius:5px;background:#333;color:#fff}
button{width:100%;padding:10px;background:#ff9800;border:none;border-radius:5px;color:#000;font-weight:bold;cursor:pointer}
button:hover{background:#ffb74d}
</style>
</head>
<body>
<div class="login-card">
  <h2>METAL BAŞLIK V10</h2>
  <input type="text" id="username" placeholder="Kullanıcı Adı">
  <input type="password" id="password" placeholder="Şifre">
  <button onclick="login()">Giriş Yap</button>
</div>
<script>
const firebaseConfig = {
const firebaseConfig = {
  apiKey: "AIzaSyBwUM5k1Yy5J3nScnPQLF",
  authDomain: "metalbasliambar.firebaseapp.com",
  projectId: "metalbasliambar",
  storageBucket: "metalbasliambar.appspot.com",
  messagingSenderId: "112168412666",
  appId: "1:112168412666:web:88521a971d06b5d941866"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function login() {
  const kadi = document.getElementById('username').value;
  const sifre = document.getElementById('password').value;
  
  db.collection("kullanicilar").where("kadi", "==", kadi).where("sifre", "==", sifre).get()
  .then((querySnapshot) => {
    if (!querySnapshot.empty) {
      alert("Giriş başarılı!");
      window.location.href = "panel.html";
    } else {
      alert("Kullanıcı adı veya şifre hatalı!");
    }
  })
  .catch((error) => {
    alert("HATA DETAYI: " + error.code + "\n" + error.message);
  });
}
</script>
</body>
</html>
